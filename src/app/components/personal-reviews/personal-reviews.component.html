<div class="container">
    <button (click)="toggleReview()" class="btn-review"><img class="icon-review" src="assets/images/icons/review.png"
            alt="">Hacer
        reseña</button>
    @for (r of reviews; track $index) {
    <article class="review">
        <figure class="left">
            <img src="assets/images/icons/userMan.png" alt="Avatar" class="icon">
        </figure>

        <div class="right">
            <header class="top">
                <div class="top-left">
                    <strong class="name">{{r.userName}}</strong>
                    <time class="date" [attr.datetime]="r.dateAdded">{{ r.dateAdded | date:'dd/MM/yyyy' }}</time>
                </div>
                <div class="stars" [attr.aria-label]="'Puntuación: ' + r.score + ' estrellas'">
                    <ng-container *ngFor="let star of [1,2,3,4,5]">
                        <svg xmlns="http://www.w3.org/2000/svg" [attr.fill]="star <= r.score ? '#ffc107' : '#e0e0e0'"
                            viewBox="0 0 24 24" stroke="#ffc107" width="20" height="20" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 17.27l6.18 3.73-1.64-7.03L22 9.24l-7.19-.61L12 2 
                             9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
                        </svg>
                    </ng-container>
                </div>

            </header>

            <section class="bottom">
                <p class="text">{{r.textReview}}</p>
            </section>
        </div>
    </article>
    }

    @if(isAdding){
    <div class="overlay" (click)="closeIfOutside($event)">
        <form [formGroup]="form" class="form-container" (click)="$event.stopPropagation()">
            <header class="top">
                <h3>Valoración</h3>
                <button (click)="toggleReview()" class="btn-close"><i class="fas fa-times"></i></button>
            </header>
            <div class="mid">
                <select formControlName="score" name="score" id="">
                    <option value="" disabled selected hidden></option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
                <svg xmlns="http://www.w3.org/2000/svg" fill="#ffc107" viewBox="0 0 24 24" stroke="#ffc107" width="24"
                    height="24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M12 17.27l6.18 3.73-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
                </svg>
            </div>
            <textarea formControlName="review" name="review" id=""
                placeholder="Contanos cómo fue tu experiencia con este profesional."></textarea>
            <button (click)="submitReview()" class="btn-share" [disabled]="form.invalid">Publicar</button>
        </form>
    </div>
    }

    @if(needLogin){
    <div class="overlay" (click)="closeIfOutside($event)">
        <div class="login-container" (click)="$event.stopPropagation()">
            <h4>Iniciá sesión para dejar una reseña.</h4>
            <button (click)="login()">Iniciar sesion</button>
        </div>
    </div>
    }

</div>
