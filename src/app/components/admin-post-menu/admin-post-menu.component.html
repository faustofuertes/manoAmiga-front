<div class="container" role="main">
  <h3>{{ cant }} publicaciones pendientes.</h3>

  <form [formGroup]="form" class="card-container" aria-label="Formulario para aprobar o rechazar publicación">
    <div class="left">
      @if (post) {
      <img class="icon" [src]="'assets/images/icons/' + post.job.toLowerCase() + '.png'"
        [alt]="'Ícono del oficio: ' + post.job" />
      }

      <span class="email" aria-label="Nombre de usuario">{{ post?.userName }}</span>

      <label for="description" class="visually-hidden">Descripción</label>
      <textarea class="desc" id="description" formControlName="description"
        placeholder="Ej: Me dedico a pintar casas, tengo herramientas propias y disponibilidad completa."
        rows="4"></textarea>
    </div>

    <div class="right">
      <div class="form-group">
        <label for="location">Ubicación</label>
        <input id="location" formControlName="location" type="text" placeholder="Ej: Mar del Plata" />
      </div>

      <div class="form-group">
        <label for="name">Nombre</label>
        <input id="name" formControlName="name" type="text" placeholder="Ej: Juan Pérez" />
      </div>

      <div class="form-group">
        <label for="job">Servicio</label>
        <input id="job" formControlName="job" type="text" placeholder="Ej: Plomería" />
      </div>

      <div class="form-group">
        <label for="phone">Número</label>
        <input id="phone" formControlName="phone" type="tel" placeholder="Ej: 2234567890" />
      </div>

      <div class="form-group">
        <label for="schedule">Horarios</label>
        <input id="schedule" formControlName="schedule" type="text" placeholder="Ej: 9 a 18 hs" />
      </div>

      <div class="form-group">
        <label for="pricing">Precio</label>
        <input id="pricing" formControlName="pricing" type="text" placeholder="Ej: $3000 por hora" />
      </div>

      <div class="form-group">
        <label for="experience">Experiencia</label>
        <input id="experience" formControlName="experience" type="text"
          placeholder="Ej: 5 años como gasista matriculado" />
      </div>
    </div>
  </form>

  <div class="btn-container" role="group" aria-label="Acciones">
    <button (click)="acceptPost()" class="btn-accept" aria-label="Aceptar publicación">
      <i class="fa-solid fa-check" aria-hidden="true"></i>
    </button>
    <button (click)="deletePost()" class="btn-decline" aria-label="Rechazar publicación">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  </div>
</div>
