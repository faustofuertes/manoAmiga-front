<div class="container" role="main">
    <section class="posts" aria-label="Listado de publicaciones">
      <app-my-posts (postClickedEmitter)="recivePost($event)" [usuario]="usuario">
      </app-my-posts>
    </section>
  
    <div class="separator" aria-hidden="true"></div>
  
    <section class="form" aria-label="Formulario para editar publicación seleccionada">
      <app-my-post-edit-form [post]="postRecived">
      </app-my-post-edit-form>
    </section>
  </div>
