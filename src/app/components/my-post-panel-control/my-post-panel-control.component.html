<div class="panel" role="main">
  <aside class="panel-sidebar" aria-label="Listado de publicaciones">
    <app-my-posts (postClickedEmitter)="recivePost($event)" [usuario]="usuario">
    </app-my-posts>
  </aside>

  <section class="panel-main" aria-label="Formulario para editar publicación seleccionada">
    <app-my-post-edit-form [post]="postRecived">
    </app-my-post-edit-form>
  </section>
</div>
