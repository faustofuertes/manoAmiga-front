<nav class="tab-bar" aria-label="Navegación del panel">
  <button
    type="button"
    (click)="emitControlPanel()"
    class="tab"
    [class.active]="activeTab === 1">
    <i class="fas fa-user tab-icon" aria-hidden="true"></i>
    <span class="tab-label">{{ 'panel.myAccount' | translate }}</span>
  </button>

  <button
    type="button"
    (click)="emitMyPosts()"
    class="tab"
    [class.active]="activeTab === 2">
    <i class="fas fa-bullhorn tab-icon" aria-hidden="true"></i>
    <span class="tab-label">{{ 'panel.myPosts' | translate }}</span>
  </button>
</nav>
