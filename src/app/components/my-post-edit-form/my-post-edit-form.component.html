@if(post){
<div class="container" role="form" aria-label="Formulario para editar publicación">

  <form [formGroup]="form" novalidate>

    <div class="form-group">
      <label class="color" for="location">Ubicación</label>
      <select id="location" formControlName="location" name="location" aria-required="true">
        <option value="" disabled selected>Selecciona una ciudad</option>
        <option *ngFor="let location of locations" [value]="location">{{ location }}</option>
      </select>
    </div>

    <div class="form-group">
      <label class="color" for="phone">Número de contacto</label>
      <input id="phone" formControlName="phone" type="text" placeholder="2231234567" aria-required="true" />
    </div>

    <div class="form-group">
      <label class="color" for="schedule">Horarios</label>
      <input id="schedule" formControlName="schedule" type="text" placeholder="Ej: Lunes a Viernes 8:00 a 16:00" />
    </div>

    <div class="form-group">
      <label class="color" for="pricing">Tarifa de visita</label>
      <input id="pricing" placeholder="15000" formControlName="pricing" type="number" min="0" aria-required="true" />
    </div>

    <div class="form-group">
      <label class="color" for="experience">Años de experiencia</label>
      <input id="experience" formControlName="experience" type="number" min="0" placeholder="Ej: 10" />
    </div>

    <div class="form-group">
      <label class="color" for="description">Descripción</label>
      <textarea id="description" formControlName="description" aria-multiline="true"></textarea>
    </div>

    <div class="btn-container">
      <button type="button" (click)="eliminarProducto()" class="btn-delete"
        aria-label="Eliminar publicación">Eliminar</button>
      <button type="button" (click)="actualizarProducto()" class="btn-update"
        aria-label="Guardar cambios en publicación">Guardar</button>
    </div>

  </form>

</div>
}@else{
<div class="container" role="alert" aria-live="polite">
  <h2>Por favor seleccione una publicación para editarla.</h2>
</div>
}
<!-- Popup éxito -->
<div *ngIf="showSuccess" class="popup-overlay">
  <div class="popup-box">
    <div class="expanding-circle success"></div>
    <svg class="popup-check" viewBox="0 0 24 24">
      <path fill="none" stroke="#fff" stroke-width="3" d="M5 13l4 4L19 7" />
    </svg>
    <p class="popup-message">Publicación modificada con éxito</p>
  </div>
</div>

<!-- Popup eliminar -->
<div *ngIf="showSuccessDelete" class="popup-overlay">
  <div class="popup-box">
    <div class="expanding-circle error"></div>
    <svg class="popup-check" viewBox="0 0 24 24">
      <path fill="none" stroke="#fff" stroke-width="3" d="M6 18L18 6M6 6l12 12" />
    </svg>
    <p class="popup-message">Publicación eliminada con éxito</p>
  </div>
</div>
