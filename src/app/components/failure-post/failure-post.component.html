<main class="container" role="main">
  <section class="card" aria-labelledby="error-title">
    <div class="left">
      <img src="assets/images/icons/fallida.png" alt="Error al crear publicación" class="icon" />
    </div>
    <div class="right">
      <h2 id="error-title" class="status" role="alert">
        Error al crear la publicación.
      </h2>
      <p>
        Ya tenés una publicación activa para este oficio. Recordá que solo se permite
        <strong>una publicación por tipo de trabajo</strong> (por ejemplo, solo una como pintor, otra como plomero,
        etc.).
        Si querés actualizar tu publicación, podés editar la existente desde <strong>Mis avisos</strong>.
      </p>
    </div>
  </section>

  <div class="btn-container">
    <button [routerLink]="['']" class="btn-home">Inicio</button>
    <button [routerLink]="['/mi-perfil']" class="btn-posts">Mis avisos</button>
  </div>
</main>
