<div *ngIf="isLoading" class="loading-overlay">
    <div class="spinner"></div>
</div>

@if(isLoading === false){
@if(userRoles.includes('admin')){
<app-admin-header (optionSelected)="recivedSelectedOption($event)"></app-admin-header>

<div class="page-content">
    @if(selectedOption === 1){
    <app-admin-post-menu></app-admin-post-menu>
    } @else if (selectedOption === 2) {
    }
</div>
} @else {
<app-user-header (optionSelected)="recivedSelectedOption($event)"></app-user-header>

<div class="page-content">
    @if(selectedOption === 1){
    <div class="account-section">
        <app-profile-card [usuario]="usuario"></app-profile-card>

        <div class="danger-zone">
            <div class="danger-header">
                <i class="fas fa-exclamation-triangle danger-icon" aria-hidden="true"></i>
                <span>{{ 'danger.title' | translate }}</span>
            </div>
            <p class="danger-text">{{ 'danger.text' | translate }}</p>
            <button class="btn-delete-account" type="button">
                <i class="fas fa-trash-alt" aria-hidden="true"></i> {{ 'danger.delete' | translate }}
            </button>
        </div>
    </div>
    } @else if (selectedOption === 2) {
    <app-my-post-panel-control [usuario]="usuario"></app-my-post-panel-control>
    }
</div>
}}
